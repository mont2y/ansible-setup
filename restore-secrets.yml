- name: Restore rclone configuration from Bitwarden
  hosts: all
  gather_facts: true
  vars_files:
    - vars/packages.yml
  pre_tasks:
    - ansible.builtin.assert:
        that: ansible_facts['user_id'] != 'root'
    - ansible.builtin.set_fact:
        setup_home: "{{ ansible_facts['user_dir'] }}"
  roles:
    - role: secrets
      tags: [secrets]
