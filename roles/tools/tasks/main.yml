- name: Install rclone
  ansible.builtin.package:
    name: rclone
    state: present
  become: true
  when: install_rclone
- name: Install Syncthing
  ansible.builtin.package:
    name: syncthing
    state: present
  become: true
  when: install_syncthing
- name: Allow user services to run at boot and after logout
  ansible.builtin.command:
    argv: [loginctl, enable-linger, '{{ setup_user }}']
    creates: '/var/lib/systemd/linger/{{ setup_user }}'
  become: true
  when: install_syncthing
- name: Ensure the user service manager is running
  ansible.builtin.systemd_service:
    name: 'user@{{ ansible_facts["user_uid"] }}.service'
    state: started
  become: true
  when: install_syncthing and not ansible_check_mode
- name: Start and enable Syncthing in the background
  ansible.builtin.systemd_service:
    name: syncthing.service
    scope: user
    daemon_reload: true
    enabled: true
    state: started
  environment:
    XDG_RUNTIME_DIR: '/run/user/{{ ansible_facts["user_uid"] }}'
  when: install_syncthing and not ansible_check_mode
- name: Install Solaar
  ansible.builtin.package:
    name: solaar
    state: present
  become: true
  when: install_solaar
- name: Install Input Remapper on Debian/Fedora
  ansible.builtin.package:
    name: input-remapper
    state: present
  become: true
  when: install_input_remapper and setup_family != 'arch'
- name: Install Input Remapper from AUR
  ansible.builtin.include_tasks: input-remapper-arch.yml
  when: install_input_remapper and setup_family == 'arch'
- name: Detect Input Remapper daemon
  ansible.builtin.command: systemctl show -p LoadState --value input-remapper-daemon.service
  register: remapper_service
  changed_when: false
  failed_when: false
  when: install_input_remapper
- name: Start Input Remapper daemon
  ansible.builtin.systemd_service:
    name: input-remapper-daemon.service
    enabled: true
    state: started
  become: true
  when: install_input_remapper and remapper_service.stdout == 'loaded'
- name: Install Espanso
  ansible.builtin.include_tasks: espanso.yml
  when: install_espanso
