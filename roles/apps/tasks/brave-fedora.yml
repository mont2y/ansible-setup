- name: Install Brave RPM repository
  ansible.builtin.get_url:
    url: https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
    dest: /etc/yum.repos.d/brave-browser.repo
    mode: '0644'
  become: true
- name: Install Brave
  ansible.builtin.dnf:
    name: brave-browser
    state: present
  become: true
