- name: Restore secrets when requested
  ansible.builtin.command:
    argv: [bash, '{{ playbook_dir }}/scripts/restore-secrets.sh']
  environment:
    PATH: '{{ setup_home }}/.local/bin:{{ ansible_facts["env"]["PATH"] }}'
    RESTORE_BITWARDEN_SECRETS: '{{ restore_bitwarden_secrets | ternary("true", "false") }}'
    RESTORE_RCLONE_FROM_BITWARDEN: '{{ restore_rclone_from_bitwarden | ternary("true", "false") }}'
    RESTORE_SYNCTHING_FROM_BITWARDEN: '{{ restore_syncthing_from_bitwarden | ternary("true", "false") }}'
    BITWARDEN_SECRETS_REQUIRED: '{{ bitwarden_secrets_required | ternary("true", "false") }}'
    BITWARDEN_OVERWRITE_EXISTING_SECRETS: '{{ bitwarden_overwrite_existing_secrets | ternary("true", "false") }}'
    SYNCTHING_RECOVERY_ALLOW_PATHS_OUTSIDE_HOME: '{{ syncthing_recovery_allow_paths_outside_home | ternary("true", "false") }}'
    SYNCTHING_RECOVERY_ALLOW_NONEMPTY_NEW_FOLDERS: '{{ syncthing_recovery_allow_nonempty_new_folders | ternary("true", "false") }}'
    SYNCTHING_RECOVERY_WAIT_SECONDS: '{{ syncthing_recovery_wait_seconds | string }}'
    BW_SESSION: '{{ lookup("ansible.builtin.env", "BW_SESSION") }}'
  no_log: true
  when: restore_bitwarden_secrets and not ansible_check_mode
